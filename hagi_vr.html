<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>萩反射炉 幕末建設現場 360°VR</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"><style>html,body{margin:0;height:100%;background:#111;font-family:sans-serif}#panorama{width:100%;height:100%}#info{position:absolute;z-index:3;top:10px;left:10px;right:10px;color:white;text-shadow:0 1px 4px #000;pointer-events:none}#motion{position:absolute;z-index:4;bottom:28px;left:50%;transform:translateX(-50%);padding:12px 16px;border:0;border-radius:25px;background:#fff;color:#111;font-weight:bold}#note{position:absolute;z-index:3;bottom:78px;left:10px;right:10px;text-align:center;color:white;text-shadow:0 1px 4px #000;font-size:12px;pointer-events:none}</style></head><body><div id="panorama"></div><div id="info">萩反射炉・建設当時の想像復元（試作）</div><div id="note">画面を指で動かして見渡せます。スマホの向きで見る場合は下のボタンを押してください。</div><button id="motion">スマホの向きで見る</button><script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script><script>const viewer=pannellum.viewer('panorama',{type:'equirectangular',panorama:'hagi_panorama.png',autoLoad:true,showControls:true,compass:false,hfov:95});document.getElementById('motion').addEventListener('click',async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error('許可されませんでした')}viewer.startOrientation();document.getElementById('motion').textContent='向き操作を開始しました';}catch(e){alert('センサー操作を開始できませんでした。HTTPSで開いているか、ブラウザのセンサー許可をご確認ください。\n'+e.message)}});</script></body></html>
